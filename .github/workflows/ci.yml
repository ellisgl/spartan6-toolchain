# Build everything and place, route and bitgen the test designs. No ISE here,
# so no byte-for-byte cross-check: that stays `make ise-check` on a machine
# with ISE.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ccache libeigen3-dev \
            libboost-filesystem-dev libboost-program-options-dev libboost-iostreams-dev \
            libboost-system-dev libboost-thread-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: exporter -> ../build/target

      - uses: YosysHQ/setup-oss-cad-suite@v4

      # Restore and save separately: the key follows the nextpnr sources, so
      # a run that didn't change them (an exact hit) has nothing to save.
      - name: ccache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ hashFiles('nextpnr/**/*.cc', 'nextpnr/**/*.h') }}
          restore-keys: ccache-

      - name: prjcombine database
        uses: actions/cache@v6
        with:
          path: build/spartan6-*.zstd
          key: prjcombine-db-${{ hashFiles('Makefile') }}
          restore-keys: prjcombine-db-

      - name: Build nextpnr and the chip database
        run: make -j$(nproc) NPNR_CMAKE_FLAGS=-DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Save ccache
        if: steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Chip database checks
        run: make check

      - name: Rust tests
        run: CARGO_TARGET_DIR=build/target cargo test --release --manifest-path exporter/Cargo.toml

      - name: Place, route and bitgen the test designs
        run: |
          fail=0
          for d in tests/*/; do
            t=$(basename "$d")
            [ "$t" = common ] && continue
            # DSP characterization designs only feed `make timing-data`: one
            # of each kind is enough here.
            case "$t" in dsp_char0|dsp_casc_char0) ;; dsp_char*|dsp_casc_char*) continue ;; esac
            if make bit TEST="$t" > "build/$t.log" 2>&1; then
              echo "$t: ok ($(grep -o "Max frequency for clock.*" build/$t/nextpnr.log | tail -1))"
            else
              echo "::error::$t failed"; tail -30 "build/$t.log"; fail=1
            fi
          done
          exit $fail

      - name: Other devices (chip database, checks, blinky)
        run: |
          for dp in xc6slx4:tqg144 xc6slx16:ftg256 xc6slx25:fgg484 xc6slx25t:csg324 xc6slx45:csg324; do
            d=${dp%:*}; p=${dp#*:}
            make -j$(nproc) DEVICE=$d PACKAGE=$p > build/$d.log 2>&1 || { tail -30 build/$d.log; exit 1; }
            make check DEVICE=$d PACKAGE=$p | tail -1
            make bit DEVICE=$d PACKAGE=$p TEST=blinky > build/$d-blinky.log 2>&1 || { tail -30 build/$d-blinky.log; exit 1; }
            echo "$d-$p: $(grep -o 'Max frequency.*' build/$d-$p/blinky/nextpnr.log | tail -1)"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: bitstreams
          path: build/*/design.bin
