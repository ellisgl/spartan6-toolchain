[package]
name = "s6-export"
version = "0.1.0"
edition = "2024"
description = "Export a Spartan-6 device from the prjcombine database as JSON for the nextpnr himbaechel chipdb generator"
license = "0BSD OR Apache-2.0"

# prjcombine is pinned to a known-good revision. Bump deliberately: the
# database format and APIs change without notice.
[dependencies]
prjcombine-spartan6 = { git = "https://codeberg.org/prjunnamed/prjcombine.git", rev = "2b3317db3799b82b3ef5606438145ba76b9b4485" }
prjcombine-interconnect = { git = "https://codeberg.org/prjunnamed/prjcombine.git", rev = "2b3317db3799b82b3ef5606438145ba76b9b4485" }
prjcombine-entity = { git = "https://codeberg.org/prjunnamed/prjcombine.git", rev = "2b3317db3799b82b3ef5606438145ba76b9b4485", features = ["map"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
