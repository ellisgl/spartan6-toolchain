[package]
name = "s6-export"
version = "0.1.0"
edition = "2024"
description = "Export a Spartan-6 device from the prjcombine database as JSON for the nextpnr himbaechel chipdb generator"
license = "ISC"

# prjcombine is pinned to a known-good revision. Bump deliberately: the
# database format and APIs change without notice.
[dependencies]
prjcombine-spartan6 = { git = "https://codeberg.org/prjunnamed/prjcombine.git", rev = "2b3317db3799b82b3ef5606438145ba76b9b4485" }
prjcombine-interconnect = { git = "https://codeberg.org/prjunnamed/prjcombine.git", rev = "2b3317db3799b82b3ef5606438145ba76b9b4485" }
prjcombine-types = { git = "https://codeberg.org/prjunnamed/prjcombine.git", rev = "2b3317db3799b82b3ef5606438145ba76b9b4485" }
prjcombine-entity = { git = "https://codeberg.org/prjunnamed/prjcombine.git", rev = "2b3317db3799b82b3ef5606438145ba76b9b4485", features = ["map"] }
# For s6-rawdump (dumping ISE's view of the device; needs ISE via tools/ise-bin).
prjcombine-re-toolchain = { git = "https://codeberg.org/prjunnamed/prjcombine.git", rev = "2b3317db3799b82b3ef5606438145ba76b9b4485" }
prjcombine-re-xilinx-ise-dump = { git = "https://codeberg.org/prjunnamed/prjcombine.git", rev = "2b3317db3799b82b3ef5606438145ba76b9b4485" }
# For s6-xdl (ISE names for XDL output, from the geom database built by xrd2geom).
prjcombine-re-xilinx-geom = { git = "https://codeberg.org/prjunnamed/prjcombine.git", rev = "2b3317db3799b82b3ef5606438145ba76b9b4485" }
prjcombine-re-xilinx-naming = { git = "https://codeberg.org/prjunnamed/prjcombine.git", rev = "2b3317db3799b82b3ef5606438145ba76b9b4485" }
prjcombine-re-xilinx-naming-spartan6 = { git = "https://codeberg.org/prjunnamed/prjcombine.git", rev = "2b3317db3799b82b3ef5606438145ba76b9b4485" }
prjcombine-re-xilinx-rawdump = { git = "https://codeberg.org/prjunnamed/prjcombine.git", rev = "2b3317db3799b82b3ef5606438145ba76b9b4485" }
prjcombine-re-xilinx-xdl = { git = "https://codeberg.org/prjunnamed/prjcombine.git", rev = "2b3317db3799b82b3ef5606438145ba76b9b4485" }
# Vendored with fixes for ISE netgen SDF (see vendor/prjcombine-re-sdf/README.md).
prjcombine-re-sdf = { path = "vendor/prjcombine-re-sdf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
# For s6-load (termios and DTR on the Mojo's serial port).
libc = "0.2"

